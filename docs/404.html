<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الصفحة ما كاينش | سياسات</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Tajawal,Tahoma,Arial,sans-serif;background:#f5f7fa;color:#12213f;text-align:center;line-height:1.9}
h1{font-size:56px;margin:0;color:#2457a6}
a{color:#2457a6;font-weight:700}
</style>
</head>
<body>
<main>
<h1>404</h1>
<p>الصفحة اللي كتقلب عليها ما كاينش.</p>
<p><a href="/" id="home">رجوع للرئيسية</a></p>
</main>
<script>
// إلا كان الموقع على github.io/<repo>/ نرجعو للجذر ديال الريبو
(function () {
  var seg = location.pathname.split("/")[1];
  if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById("home").href = "/" + seg + "/";
})();
</script>
</body>
</html>
